# Copy to config.toml and edit. Every key is optional; defaults are shown.
# Other games: layer a game file on top, which keeps your channel and overlay settings:
#   python -m twitchplayeragent -c config.toml -c games/gta6.toml

[twitch]
channel = "your_channel_name"   # chat is read anonymously; the bot never posts

[game]
name = "Pokemon Red"
# Add "select" to re-enable it. The original run disabled it after it was used to soft-reset.
buttons = ["a", "b", "up", "down", "left", "right", "start"]
# AI mode only: what the buttons do in this game and what chat may ask for.
# Leave it out to use the built-in Pokémon Red notes.
# ai_notes = "Original Game Boy game. Each press is one tap; ..."

[anarchy]
# Inputs waiting to run; when full, the oldest are dropped so lag stays bounded.
max_queue = 100

[democracy]
# Seconds per voting round (the round opens on its first vote).
window_seconds = 20
# Max total presses in one compound input, e.g. "start9".
max_presses = 9

[meter]
to_democracy = 0.80     # share of live votes needed to switch anarchy -> democracy
to_anarchy = 0.50       # share needed to switch back democracy -> anarchy
vote_lifetime = 60      # seconds a mode vote keeps counting
min_votes = 5           # don't switch on fewer live votes than this
start_mode = "anarchy"

[ai]
# true: an AI reads all chat (commands and plain English) and picks the presses,
# instead of anarchy/democracy.
enabled = false
# "claude": Anthropic API. Needs pip install -e ".[claude]" and ANTHROPIC_API_KEY.
# "ollama": a free local model. Needs Ollama running and: ollama pull qwen3.5:27b
provider = "claude"
model = ""              # empty = claude-haiku-5-5 (claude) or qwen3.5:27b (ollama)
effort = "low"          # claude only
ollama_url = "http://localhost:11434"
window_seconds = 10     # chat per decision
max_presses = 9         # presses per decision

[backend]
type = "pyboy"          # "pyboy" (built-in emulator), "keyboard" (external emulator), or "log"
                        # ("gamepad", a virtual Xbox controller, comes with a game file like games/gta6.toml)
hold_frames = 2         # PyBoy only: frames a button is held (60 frames = 1 second)
release_frames = 2      # PyBoy only: frames between presses

[backend.pyboy]
rom = "roms/pokemon_red.gb"           # your own legally obtained ROM
state_file = "saves/pokemon_red.state"
autosave_minutes = 5
window = "SDL2"                       # "null" runs headless
scale = 4
window_keyboard = false               # true = your keyboard also plays when the game window is focused

[backend.keyboard]
hold_ms = 50
gap_ms = 50

[backend.keyboard.keys]   # match your emulator's key bindings
a = "x"
b = "z"
start = "enter"
select = "backspace"
up = "up"
down = "down"
left = "left"
right = "right"

[overlay]
# One OBS Browser Source: http://localhost:8080 at 1920x1080. Shows the game, the input list,
# the anarchy/democracy meter and votes, and keeps working when the game window is minimized.
enabled = true
port = 8080
max_lines = 20
audio = true            # game sound through the Browser Source (the game window is muted)
