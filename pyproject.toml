[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twitchplayeragent"
version = "0.1.0"
description = "Control games from Twitch chat, Twitch Plays Pokémon style"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pyboy = ["pyboy>=2.0"]
claude = ["anthropic"]
keyboard = ["pynput>=1.7", "pydirectinput>=1.0; sys_platform == 'win32'"]
dev = ["pytest>=8"]

[project.scripts]
twitchplayeragent = "twitchplayeragent.__main__:main"

[tool.setuptools.packages.find]
include = ["twitchplayeragent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
